<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Теории — платформа для публикации, обсуждения и голосования за теории и отслеживания их сбытия."
    />
    <meta name="theme-color" content="#1c1916" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,460;0,7..72,560;0,7..72,680;1,7..72,460&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Теории</title>
    <script>
      try {
        const raw = localStorage.getItem('teorii.v1')
        const saved = raw ? JSON.parse(raw) : {}
        const theme = saved.theme || 'dark'
        const locale = saved.locale === 'en' ? 'en' : 'ru'
        document.documentElement.lang = locale
        document.documentElement.classList.toggle('dark', theme !== 'light')
        document.querySelector('meta[name="theme-color"]').setAttribute(
          'content',
          theme === 'light' ? '#f6f1e6' : '#1c1916',
        )
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
